dt: 0.001
kp_true: [5.0, 5.0, 5.0, 10.0, 20.0, 20.0]
zeta: 0.9
vel_limit: 4.0
topic_cmd: /cmd/joint_states
topic_equil: /equil/joint_states
topic_imu: /imu
imu_frames: "link2;link3;link6"
integrator: rk4
ref_tau: 0.04
ref_max_vel: 4.0
eq_mode: dynamic
tau_eq: 0.05
# Quasi-static joint-state noise/vibration injection. Keep these at 0 for stable tests.
qs_noise_std_deg: 0.2
qs_vib_amp_deg: 0.0
qs_vib_freq_hz: 50.0
qs_vib_axes: []
qs_seed: 0
spring_model: periodic
equilibrium_refine: true
equilibrium_refine_maxiter: 40
equilibrium_refine_tol: 1.0e-12
