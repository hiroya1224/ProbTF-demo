[metadata]
name = prob-artag-benchmark
version = 0.1.0
description = Offline deterministic benchmark for the probabilistic AprilTag pipeline
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
python_requires = >=3.8
packages = find:
package_dir =
    = src
install_requires =
    numpy>=1.20
    opencv-contrib-python>=4.5
    scipy>=1.5

[options.extras_require]
test =
    pytest>=6

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    prob-artag-benchmark = prob_artag_benchmark.cli:main
    prob-artag-aggregate = prob_artag_benchmark.aggregate:main
