[metadata]
name = prob-artag-renderer
version = 0.1.0
description = Deterministic synthetic AprilTag geometry and rendering fixtures
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.20
    PyYAML>=5.3

[options.packages.find]
where = src

[options.package_data]
prob_artag_renderer = default_scene.yaml

[options.extras_require]
render =
    opencv-contrib-python>=4.5
    pyrender>=0.1.45
test =
    pytest>=6

[options.entry_points]
console_scripts =
    prob-artag-render-single = prob_artag_renderer.cli:render_single_main
    prob-artag-render-scene = prob_artag_renderer.cli:render_scene_main
    prob-artag-generate-dataset = prob_artag_renderer.cli:generate_dataset_main
