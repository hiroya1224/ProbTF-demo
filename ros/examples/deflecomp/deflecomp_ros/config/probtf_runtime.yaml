dynamic_topic: /deflecomp/probtf
dynamic_batch_topic: /deflecomp/probtf_batch
static_topic: /deflecomp/probtf_static
marker_topic: /deflecomp/probtf_point_moments

# Empty target/tip values are inferred from the launch URDF.
target_frame: ""
tip_frame: ""
source_frames: []
frame_prefixes: [ref, cmd, equil]
source_point: [0.0, 0.0, 0.0]

# The C++ consumer works from an atomic complete batch and never queues old
# batches. This value remains for the optional Python compatibility consumer.
max_records_per_edge: 4
subscribe_individual_dynamic: false
lookup_rate_hz: 50.0
marker_max_age: 0.5
sigma_scale: 2.0
point_scale: 0.025
axis_width: 0.006
