dt: 0.001
# Dynamics still integrate at dt, while ROS state/IMU output is decimated to a
# rate useful to the 50 Hz controller and robot_state_publisher.
publish_rate_hz: 100.0
kp_true: [5.0, 5.0, 5.0, 10.0, 20.0, 20.0]
zeta: 0.9
vel_limit: 4.0
topic_cmd: /cmd/joint_states
topic_equil: /equil/joint_states
topic_imu: /imu
external_wrench_topic: /deflecomp_sim/external_wrench
# <= 0 keeps the last commanded wrench until a clear command is received.
external_wrench_timeout: 0.0
imu_frames: []
integrator: semi_implicit
ref_tau: 0.1
ref_max_vel: 4.0
eq_mode: dynamic
tau_eq: 0.05
# Quasi-static link vibration/noise. Only this perturbation is finite-differenced,
# so synthetic IMU angular velocity and acceleration reflect the vibration while
# zero noise/vibration restores gravity-only quasi-static IMU observations.
qs_noise_std_deg: 0.0
qs_vib_amp_deg: 0.0
qs_vib_freq_hz: 50.0
qs_vib_axes: []
qs_seed: 0
spring_model: periodic
equilibrium_refine: true
equilibrium_refine_maxiter: 40
equilibrium_refine_tol: 1.0e-12

# roslaunch deflecomp_ros deflecomp_frames.launch model:=/home/leus/catkin_ws/src/nejineji-urdfs/yamaguchi_arm_nejineji/urdf/yamaguchi_6axis_arm_nejineji.urdf imu_config:=/home/leus/catkin_ws/src/nejineji-urdfs/yamaguchi_arm_nejineji/config/deflecomp_imu_frames.yaml
