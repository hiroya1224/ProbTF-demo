schema: grape_failure_automatic_analysis/v2

topics:
  command: /gimbalrotor/four_axes/command
  gimbal: /gimbalrotor/gimbals_ctrl
  imu: /gimbalrotor/sensor_plugin/imu1/ros_converted
  odometry: /gimbalrotor/uav/cog/odom
  flight_state: /gimbalrotor/flight_state

controller_topics:
  pid_debug: /gimbalrotor/debug/pose/pid
  xy: /gimbalrotor/controller/xy/parameter_updates
  z: /gimbalrotor/controller/z/parameter_updates
  roll_pitch: /gimbalrotor/controller/roll_pitch/parameter_updates
  yaw: /gimbalrotor/controller/yaw/parameter_updates

# Flight state supplies controller intent.  Liftoff is still inferred from the
# stationary support plane immediately preceding each active episode.
episode_detection:
  active_flight_states: [3, 4, 5, 17]
  diagnostic_flight_states: [17]
  baseline_window_s: 3.0
  minimum_active_duration_s: 0.5
  minimum_liftoff_height_m: 0.02
  minimum_airborne_duration_s: 0.5
  persistence_s: 0.10
  standardized_threshold: 4.0

# The current estimator is deliberately an effective command-response model,
# not a calibrated physical mass/inertia posterior.
estimation:
  sample_rate_hz: 50.0
  smoothing_window_s: 0.08
  maximum_delay_s: 0.15
  delay_step_s: 0.01
  bootstrap_samples: 100
  bootstrap_block_s: 0.25
  huber_delta: 1.5
  ridge: 1.0e-8
  seed: 7
  minimum_input_std: 0.001
  minimum_r2: 0.05
  maximum_relative_interval_width: 4.0

presentation:
  parameter_trace_step_s: 0.5
