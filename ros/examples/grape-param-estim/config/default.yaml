  preview_bag_path: /home/leus/catkin_ws/bags/grape-drone/20260613_grape_hovering/20260613_grape_hovering_1_2026-06-13-13-44-01.bag
  bag_paths:
    - /home/leus/catkin_ws/bags/grape-drone/20260613_grape_hovering/20260613_grape_hovering_1_2026-06-13-13-44-01.bag
  topics:
    thrust_command: /gimbalrotor/four_axes/command
    gimbal_command: /gimbalrotor/gimbals_ctrl
    gimbal_state: /gimbalrotor/joint_states
    imu: /gimbalrotor/sensor_plugin/imu1/ros_converted
