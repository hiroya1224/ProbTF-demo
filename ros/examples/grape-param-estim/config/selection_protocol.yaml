evaluation:
  seeds: [7, 19, 43]
  required_hard_gates:
    - online_prefix_no_future_data
    - frame_unit_motor_order_timestamp_and_mode_match
    - finite_quaternion_variance_and_weight_diagnostics
    - synthetic_95pct_coverage_ci_contains_0_95
    - predictive_intervals_monotonic_and_calibrated
    - unsupported_candidates_never_recommended
    - reproducible_from_hash_and_seed
  common_random_numbers:
    require_same_trajectory_sample_bundle: true
    require_same_candidate_grid: true
    require_same_random_stream: true
  bootstrap:
    unit: episode
    draws: 4000
    credible_probability: 0.95
    seed: 24072026
  one_standard_error_rule: true
  predictive_interval_levels: [0.50, 0.80, 0.95]
  synthetic_coverage:
    nominal_probability: 0.95
    required_binomial_ci_contains_nominal: true

controller_replay_thresholds:
  continuous_normalized_rmse_max: 0.01
  continuous_normalized_max_error: 0.03
  discrete_event_match_min: 1.0
  surrogate_speedup_min: 5.0

support_thresholds:
  recommendation_lower_credible_bound: 0.80
  supported_standardized_distance_max: 2.0
  unsupported_standardized_distance_min: 5.0
  minimum_importance_weight_ess: 20.0

counterfactual_candidate_bounds:
  roll_pitch_p: [5.0, 25.0]
  roll_pitch_d: [5.0, 40.0]
  controller_mass_kg: [0.5, 2.0]
  allocation_scale: [0.7, 1.3]
  thrust_scale: [0.7, 1.3]
  delay_compensation_s: [0.0, 0.25]

target_tube:
  position_tolerance_m: [0.20, 0.20, 0.20]
  attitude_tolerance_rad: [0.1745329252, 0.1745329252, 0.2617993878]
  linear_velocity_tolerance_mps: [0.40, 0.40, 0.40]
  angular_velocity_tolerance_radps: [0.50, 0.50, 0.70]
  maximum_continuous_saturation_s: 0.20
  minimum_height_m: 0.10
  maximum_tilt_rad: 0.6108652382

candidate_groups:
  trajectory_smoother:
    primary_metric: held_out_log_predictive_density
    direction: maximize
    candidates:
      - candidate_id: error_state_ekf_rts
        complexity_rank: 1
        description: application-local error-state EKF plus RTS
      - candidate_id: factor_graph_imu_preintegration
        complexity_rank: 2
        description: optional dense factor-graph vertical slice

  controller_replay:
    primary_metric: factual_continuous_normalized_rmse
    direction: minimize
    blocking_candidate_id: exact_cpp_pc_mcu_replay
    candidates:
      - candidate_id: exact_cpp_pc_mcu_replay
        complexity_rank: 1
        description: deployed PC/MCU controller oracle
        required_hard_gates:
          - exact_continuous_nrmse_le_0_01
          - exact_max_error_le_0_03
          - exact_discrete_event_match_eq_1
      - candidate_id: python_vector_pid_surrogate
        complexity_rank: 2
        description: vectorized approximation for candidate screening
        required_hard_gates:
          - surrogate_matches_exact_gate
          - surrogate_speedup_ge_5

  effective_response:
    primary_metric: held_out_multistep_log_predictive_density
    direction: maximize
    candidates:
      - candidate_id: low_dim_effective_response
        complexity_rank: 1
        description: identifiable low-dimensional effective response
      - candidate_id: structured_6dof_mechanics
        complexity_rank: 2
        description: mechanics model with explicit scale gauge
      - candidate_id: effective_sparse_gp_residual
        complexity_rank: 3
        description: conditional residual model
        required_hard_gates:
          - parametric_residual_structure_confirmed
          - gp_improves_two_independent_episodes
          - gp_uncertainty_expands_outside_support

  inference:
    primary_metric: held_out_log_predictive_density
    direction: maximize
    candidates:
      - candidate_id: modular_tempered_smc
        complexity_rank: 1
        description: modular trajectory-marginalized SMC
      - candidate_id: joint_pmcmc
        complexity_rank: 2
        description: optional joint PMCMC vertical slice
      - candidate_id: likelihood_free_bayessim
        complexity_rank: 3
        description: conditional likelihood-free candidate
        required_hard_gates:
          - likelihood_candidates_failed_calibration
          - black_box_simulator_validated_on_held_out_bags

  counterfactual_usefulness:
    primary_metric: held_out_brier_score
    direction: minimize
    blocking_candidate_id: bayesian_closed_loop
    candidates:
      - candidate_id: bayesian_closed_loop
        complexity_rank: 3
        description: posterior closed-loop target-tube evaluator
        required_hard_gates:
          - exact_controller_oracle_available
          - baseline_improvement_ci_excludes_zero
          - target_tube_coverage_gate
      - candidate_id: nominal_deterministic
        complexity_rank: 2
        description: deterministic nominal baseline
      - candidate_id: climatology
        complexity_rank: 1
        description: episode-stratum rate baseline
